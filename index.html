<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{display:flex;flex-direction:column;background:#0b0f1f;color:#e8ecff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);overflow:hidden}
header{padding:12px 16px 4px;text-align:center}
h1{margin:0;font:700 clamp(18px,4.6vw,30px) Georgia,"Times New Roman",serif;letter-spacing:.04em;text-transform:uppercase}
#sub{margin:4px 0 0;color:#98a2c8;font-size:13px}
#wrap{position:relative;flex:1;min-height:0}
svg{width:100%;height:100%;display:block;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.zoom{position:absolute;left:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:40px;height:40px;border-radius:10px;border:1px solid #2b3868;background:#121935;color:#e8ecff;font-size:20px;cursor:pointer}
.sheet{position:absolute;left:10px;right:10px;bottom:10px;max-width:560px;margin:0 auto;max-height:64%;overflow:auto;background:rgba(18,25,53,.97);border:1px solid #3c4f9a;border-radius:16px;padding:16px 16px 14px;transform:translateY(120%);transition:transform .28s ease;box-shadow:0 10px 40px rgba(0,0,0,.5)}
.sheet.on{transform:none}
.sheet h2{margin:0;font:700 22px Georgia,serif}
.badge{display:inline-block;min-width:26px;height:26px;line-height:26px;text-align:center;border-radius:13px;background:#ff4d6d;color:#fff;font:700 14px system-ui;margin-right:8px;vertical-align:middle}
.x{position:absolute;right:10px;top:8px;width:36px;height:36px;border:0;background:none;color:#98a2c8;font-size:26px;cursor:pointer}
.where{margin:8px 0 2px;color:#98a2c8;font-size:14px}
.where a{color:#4d7bff;text-decoration:none;margin-right:12px;white-space:nowrap}
.sheet h3{margin:12px 0 2px;font-size:11px;letter-spacing:.1em;color:#4d7bff}
.sheet h3.l{color:#ff4d6d}
.sheet p{margin:0;font-size:15px;line-height:1.5}
.sheet p.i{font-family:Georgia,serif;font-style:italic;color:#b9c2e6}
.go{display:inline-block;margin-top:12px;padding:10px 16px;border-radius:10px;background:#4d7bff;color:#fff;text-decoration:none;font-weight:700;font-size:14px}
nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;overflow-y:auto;max-height:34%;padding:10px 12px 12px;border-top:1px solid #1d2858}
nav::-webkit-scrollbar{display:none}
nav button{flex:none;border:1px solid #2b3868;background:#121935;color:#e8ecff;border-radius:18px;padding:8px 13px;font-size:13px;cursor:pointer;white-space:nowrap}
nav button.on{background:#4d7bff;border-color:#4d7bff}
nav button b{color:#4d7bff;margin-right:5px}nav button.on b{color:#fff}
.lbl{display:none;font:700 12px system-ui,sans-serif;fill:#e8ecff;paint-order:stroke;stroke:#0b0f1f;stroke-width:3.5px;stroke-linejoin:round;pointer-events:none}
body.lab .lbl,.pin.sel .lbl{display:block}
.pin{cursor:pointer}
.pin .c{fill:#4d7bff;stroke:#0b0f1f;stroke-width:2}
.pin .h{fill:#4d7bff;opacity:.2}
.pin text.n{font:700 12px system-ui,sans-serif;fill:#fff;text-anchor:middle;pointer-events:none}
.pin.sel .c,.pin.sel .h{fill:#ff4d6d}
.pin.new .h{animation:p 1.8s ease-out infinite}
@keyframes p{0%{r:14;opacity:.5}100%{r:30;opacity:0}}
.ed{position:absolute;right:10px;top:10px;z-index:3}
.ed button,.form button{background:#4d7bff;color:#fff;border:0;border-radius:10px;padding:10px 14px;font-weight:700;cursor:pointer}
.form{position:absolute;inset:8px;background:rgba(11,15,31,.98);border:1px solid #3c4f9a;border-radius:14px;padding:14px;overflow:auto;display:none}
.form.on{display:block}
.form input,.form textarea{width:100%;margin:4px 0 8px;padding:9px;border-radius:8px;border:1px solid #2b3868;background:#121935;color:#e8ecff;font:14px system-ui}
.form code{display:block;white-space:pre-wrap;word-break:break-all;background:#121935;padding:8px;border-radius:8px;font-size:12px;margin:6px 0}

/* ===== конец списка. Поле "new":true даёт точке мигающий кружок (пометка последнего выпуска) ===== */
const X0=-0.6800635709733317,Y0=-0.21719218844963062,K0=805.5794879949982,MH=559.19,R2D=Math.PI/180,LON0=100,LAT0=60,PH1=52,PH2=68;
const NN=Math.log(Math.cos(PH1*R2D)/Math.cos(PH2*R2D))/Math.log(Math.tan(Math.PI/4+PH2*R2D/2)/Math.tan(Math.PI/4+PH1*R2D/2));
const FF=Math.cos(PH1*R2D)*Math.pow(Math.tan(Math.PI/4+PH1*R2D/2),NN)/NN;
const rho=la=>FF/Math.pow(Math.tan(Math.PI/4+la*R2D/2),NN),RHO0=rho(LAT0);
function proj(lon,lat){const th=NN*(lon-LON0)*R2D,r=rho(lat);return[(r*Math.sin(th)-X0)*K0,MH-(RHO0-r*Math.cos(th)-Y0)*K0]}
const $=id=>document.getElementById(id),svg=$("map"),world=$("world"),pinsG=$("pins"),linesG=$("lines"),sheet=$("sheet"),chips=$("chips");
const NS="http://www.w3.org/2000/svg",esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let K=1,TX=0,TY=0,sel=-1,pins=[];
const ptr=new Map();let moved=false,pinch=0;
const ctm=()=>svg.getScreenCTM(),toVB=(x,y)=>{const p=svg.createSVGPoint();p.x=x;p.y=y;return p.matrixTransform(ctm().inverse())};
function mk(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function build(){
  pinsG.innerHTML="";linesG.innerHTML="";chips.innerHTML="";pins=[];
  PLACES.forEach((p,i)=>{
    const[x,y]=proj(p.lon,p.lat),px=x+(p.ox||0),py=y-(p.oy||0);
    if(p.ox||p.oy){mk("line",{x1:x,y1:y,x2:px,y2:py,stroke:"#4d7bff","stroke-width":1.2,"vector-effect":"non-scaling-stroke"},linesG);mk("circle",{cx:x,cy:y,r:2,fill:"#4d7bff"},linesG)}
    const g=mk("g",{"class":"pin"+(p.new?" new":"")},pinsG),r=innerWidth<600?10:13;
    mk("circle",{"class":"h",r:r+7},g);mk("circle",{"class":"c",r:r},g);
    const t=mk("text",{"class":"n",y:4},g);t.textContent=i+1;
    const s=p.s||"r",lb=mk("text",{"class":"lbl",x:s=="r"?r+6:s=="l"?-r-6:0,y:s=="t"?-r-8:s=="b"?r+17:4,"text-anchor":s=="r"?"start":s=="l"?"end":"middle"},g);lb.textContent=p.n;
    g.addEventListener("click",e=>{if(!moved)show(i)});
    pins.push({g,x:px,y:py});
    const b=document.createElement("button");b.innerHTML="<b>"+(i+1)+"</b>"+esc(p.n);b.onclick=()=>show(i,true);chips.appendChild(b);
  });apply();
}
function apply(){
  world.setAttribute("transform","translate("+TX+" "+TY+") scale("+K+")");
  const a=ctm().a;pins.forEach(p=>p.g.setAttribute("transform","translate("+(TX+p.x*K)+" "+(TY+p.y*K)+") scale("+(1/a)+")"));
  document.body.classList.toggle("lab",K>=1.6||svg.clientWidth>=760);
}
function zoomAt(f,cx,cy){const n=Math.min(12,Math.max(1,K*f));f=n/K;TX=cx-(cx-TX)*f;TY=cy-(cy-TY)*f;K=n;if(K==1){TX=0;TY=0}apply()}
function center(){const v=svg.viewBox.baseVal;return[v.x+v.width/2,v.y+v.height/2]}
$("zi").onclick=()=>zoomAt(1.6,...center());$("zo").onclick=()=>zoomAt(1/1.6,...center());$("zr").onclick=()=>{K=1;TX=0;TY=0;apply()};
svg.addEventListener("wheel",e=>{e.preventDefault();const p=toVB(e.clientX,e.clientY);zoomAt(e.deltaY<0?1.2:1/1.2,p.x,p.y)},{passive:false});
svg.addEventListener("pointerdown",e=>{ptr.set(e.pointerId,{x:e.clientX,y:e.clientY,sx:e.clientX,sy:e.clientY});moved=false;pinch=ptr.size==2?dist():0});
window.addEventListener("pointermove",e=>{
  const o=ptr.get(e.pointerId);if(!o)return;
  if(ptr.size==1){
    if(Math.hypot(e.clientX-o.sx,e.clientY-o.sy)>6)moved=true;
    if(moved){const u=1/ctm().a;TX+=(e.clientX-o.x)*u;TY+=(e.clientY-o.y)*u;apply()}
    o.x=e.clientX;o.y=e.clientY;
  }else{
    o.x=e.clientX;o.y=e.clientY;moved=true;const d=dist();
    if(pinch){const m=mid(),p=toVB(m[0],m[1]);zoomAt(d/pinch,p.x,p.y)}pinch=d;
  }
});
const up=e=>{ptr.delete(e.pointerId);pinch=0;setTimeout(()=>moved=false,50)};window.addEventListener("pointerup",up);window.addEventListener("pointercancel",up);
function dist(){const a=[...ptr.values()];return Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y)}
function mid(){const a=[...ptr.values()];return[(a[0].x+a[1].x)/2,(a[0].y+a[1].y)/2]}
function fmt(v,a,b){return Math.abs(v).toFixed(2)+"° "+(v>=0?a:b)}
function show(i,reveal){
  sel=i;const p=PLACES[i];pins.forEach((q,j)=>q.g.classList.toggle("sel",j==i));[...chips.children].forEach((c,j)=>c.classList.toggle("on",j==i));
  const ya="https://yandex.ru/maps/?ll="+p.lon+"%2C"+p.lat+"&z=8&pt="+p.lon+","+p.lat,gg="https://www.google.com/maps/search/?api=1&query="+p.lat+","+p.lon;
  sheet.innerHTML='<button class="x" aria-label="Закрыть">×</button><h2><span class="badge">'+(i+1)+'</span>'+esc(p.n)+'</h2>'+
   '<div class="where">📍 '+esc(p.r)+' · '+fmt(p.lat,"с. ш.","ю. ш.")+', '+fmt(p.lon,"в. д.","з. д.")+'<br><a href="'+ya+'" target="_blank" rel="noopener">Яндекс Карты</a><a href="'+gg+'" target="_blank" rel="noopener">Google Карты</a></div>'+
   '<h3>ИЗВЕСТНО</h3><p>'+esc(p.k)+'</p><h3 class="l">ЛЕГЕНДА</h3><p class="i">'+esc(p.l)+'</p>'+
   (p.url?'<a class="go" href="'+esc(p.url)+'" target="_blank" rel="noopener">▶ Смотреть выпуск</a>':"");
  sheet.querySelector(".x").onclick=()=>hide();sheet.classList.add("on");sheet.scrollTop=0;
  
  if(K>1){const r=svg.getBoundingClientRect(),a=ctm().a,py=ctm().f-r.top+(TY+pins[i].y*K)*a;if(py>r.height*.42||py<0){TY-=(py-r.height*.22)/a;apply()}}
}
function hide(){sel=-1;sheet.classList.remove("on");pins.forEach(q=>q.g.classList.remove("sel"));[...chips.children].forEach(c=>c.classList.remove("on"))}
svg.addEventListener("click",e=>{if(!e.target.closest(".pin")&&!moved)hide()});
addEventListener("resize",()=>{build();if(sel>=0)pins[sel].g.classList.add("sel")});

$("f_ok").onclick=()=>{
  const c=$("f_c").value.replace(/,/g," ").split(/\s+/).filter(Boolean).map(s=>parseFloat(s)),n=$("f_n").value.trim();
  if(!n||c.length<2||c.some(isNaN)){alert("Заполните название и координаты: широта, долгота");return}
  const o={n,r:$("f_r").value.trim(),lat:c[0],lon:c[1],k:$("f_k").value.trim(),l:$("f_l").value.trim(),url:$("f_u").value.trim(),s:"r",new:true};

  $("f_code").textContent=JSON.stringify(o)+",";$("f_out").hidden=false;
};
